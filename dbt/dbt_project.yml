name: 'weather_analytics'
version: '1.0.0'
config-version: 2

profile: 'weather_analytics'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "{{ env_var('DBT_TARGET_PATH', 'target') }}"
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets: ["target", "dbt_packages"]

models:
  weather_analytics:
    # Input (transform) models are built as CTEs inside downstream queries
    transform:
      +materialized: ephemeral
    # Analytics models are persisted as tables in the ANALYTICS schema
    analytics:
      +materialized: table
      +schema: analytics

snapshots:
  weather_analytics:
    +target_schema: snapshot
